events {
    worker_connections 1024;
}

http {
    set_real_ip_from 192.168.102.0/23;
    real_ip_header X-Forwarded-For;    # Use this header to find the real IP
    real_ip_recursive on;              # Handle multiple proxies recursively

    include       mime.types;
    default_type  application/octet-stream;



    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 60s;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    server {
        listen 80;
        
        set $backend "backend:8000";

        root /usr/share/nginx/html;
        index index.html;

        location /nginx_health {
            access_log off;
            return 200 "OK";
        }

        # Frontend
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Short Links
        location /s/ {
            rewrite ^/s/(.*) /short-links/visit/$1 break;
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Backend API
        location /api/ {
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # Allow larger file uploads
            client_max_body_size 50M;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

        }
        
        location /uploads/ {
            alias /srv/uploads/;
            types {
                image/png         png;
                image/jpeg        jpg jpeg;
                image/gif         gif;
                image/webp        webp;
                image/svg+xml     svg;
                video/mp4         mp4;
                video/webm        webm;
                video/quicktime   mov;
                video/x-msvideo   avi;
                video/x-matroska  mkv;
            }
            default_type application/octet-stream;
            add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
