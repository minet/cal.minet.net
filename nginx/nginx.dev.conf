events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    map $status $loggable {
        200     0;
        304     0;
        default 1;
    }

    access_log /var/log/nginx/access.log combined if=$loggable;

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        set $frontend_upstream frontend:5173;
        set $backend_upstream backend:8000;
        set $minio_upstream minio:9000;
        set $mailhog_upstream mailhog:8025;
        set $pgadmin_upstream pgadmin:80;

        ssl_certificate /etc/nginx/certs/self-signed.crt;
        ssl_certificate_key /etc/nginx/certs/self-signed.key;

        # Frontend
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Short Links
        location /s/ {
            proxy_pass http://$backend_upstream/short-links/visit/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Allow larger file uploads
            client_max_body_size 50M;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # MinIO Storage
        location /uploads/ {
            rewrite ^/uploads/(.*)$ /calendint/$1 break;
            proxy_pass http://$minio_upstream$uri$is_args$args;
            proxy_set_header Host $minio_upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Allow larger file uploads
            client_max_body_size 50M;
        }

        # Mailhog
        location /mailhog/ {
            proxy_pass http://$mailhog_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PgAdmin
        location /pgadmin/ {
            proxy_pass http://$pgadmin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
