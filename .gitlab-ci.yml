stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_REGISTRY_BASE: $CI_REGISTRY_IMAGE
  DOCKER_TLS_CERTDIR: "/certs"
  SWARM_FOLDER: /mnt/cephfs/swarm/stacks/cal.minet.net
  DOCKER_BUILDKIT: 1

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
  - |
    if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
      export IMAGE_TAG=stable
    elif [ "$CI_COMMIT_REF_NAME" = "pre-prod" ]; then
      export IMAGE_TAG=prep
    else
      export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    fi

# Promotion guard: main only receives code that went through pre-prod first.
# An MR into main must come from pre-prod.
guard_main_mr_source:
  stage: .pre
  image: alpine:latest
  before_script: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "pre-prod"
  script:
    - echo "MRs into $CI_DEFAULT_BRANCH must come from pre-prod (source is $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME)."
    - echo "Retarget this MR to pre-prod, test on preprod, then open pre-prod -> $CI_DEFAULT_BRANCH."
    - exit 1

# Every non-merge commit on main must already be on pre-prod. Runs in .pre so
# nothing gets built as :stable or deployed to prod when the check fails.
guard_main_from_preprod:
  stage: .pre
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add --no-cache git
    - git fetch origin pre-prod
    - |
      MISSING=$(git log --no-merges --oneline FETCH_HEAD..$CI_COMMIT_SHA)
      if [ -n "$MISSING" ]; then
        echo "These commits are on $CI_DEFAULT_BRANCH but not on pre-prod:"
        echo "$MISSING"
        echo "Merge them into pre-prod and validate on preprod before promoting."
        exit 1
      fi
      echo "OK: every commit on $CI_DEFAULT_BRANCH is on pre-prod."

build_backend:
  stage: build
  image: docker:latest
  rules:
    - changes:
        - backend/**/*
  script:
    - cd backend
    - docker pull $IMAGE_REGISTRY_BASE/backend:$IMAGE_TAG || true
    - docker build --cache-from $IMAGE_REGISTRY_BASE/backend:$IMAGE_TAG --build-arg BUILDKIT_INLINE_CACHE=1 -f Dockerfile.prod -t $IMAGE_REGISTRY_BASE/backend:$IMAGE_TAG .
    - docker push $IMAGE_REGISTRY_BASE/backend:$IMAGE_TAG

build_nginx:
  stage: build
  image: docker:latest
  rules:
    - changes:
        - frontend/**/*
        - nginx/**/*
  script:
    - docker pull $IMAGE_REGISTRY_BASE/nginx:$IMAGE_TAG || true
    - docker build --cache-from $IMAGE_REGISTRY_BASE/nginx:$IMAGE_TAG --build-arg BUILDKIT_INLINE_CACHE=1 -f nginx/Dockerfile -t $IMAGE_REGISTRY_BASE/nginx:$IMAGE_TAG .
    - docker push $IMAGE_REGISTRY_BASE/nginx:$IMAGE_TAG

build_media_processor:
  stage: build
  image: docker:latest
  rules:
    - changes:
        - media-processor/**/*
  script:
    - cd media-processor
    - docker pull $IMAGE_REGISTRY_BASE/media-processor:$IMAGE_TAG || true
    - docker build --cache-from $IMAGE_REGISTRY_BASE/media-processor:$IMAGE_TAG --build-arg BUILDKIT_INLINE_CACHE=1 -f Dockerfile -t $IMAGE_REGISTRY_BASE/media-processor:$IMAGE_TAG .
    - docker push $IMAGE_REGISTRY_BASE/media-processor:$IMAGE_TAG

deploy_prod:
  stage: deploy
  trigger:
    project: minet/configurations/push/swarm-prod
    branch: main
    strategy: depend
    inputs:
      folder_name: cal.minet.net
      image_registry: $CI_REGISTRY_IMAGE
  needs:
    - job: guard_main_from_preprod
    - job: build_backend
      optional: true
    - job: build_nginx
      optional: true
    - job: build_media_processor
      optional: true
  only:
    - main

deploy_preprod:
  stage: deploy
  trigger:
    project: minet/configurations/push/swarm-prod
    branch: preprod
    strategy: depend
    inputs:
      folder_name: cal.minet.net
      image_registry: $CI_REGISTRY_IMAGE
  needs:
    - job: build_backend
      optional: true
    - job: build_nginx
      optional: true
    - job: build_media_processor
      optional: true
  only:
    - pre-prod
